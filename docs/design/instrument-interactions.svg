<path d="M1506 735 L1516 745" stroke="#ECEEF2" stroke-width="1" fill="none" stroke-linecap="round" />
<path d="M1516 735 L1506 745" stroke="#ECEEF2" stroke-width="1" fill="none" stroke-linecap="round" />
<text x="782" y="785" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="11" font-weight="400" >Interactive</text>
<text x="1161" y="785" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="11" font-weight="400" text-anchor="middle">Drag / double-click / system menu</text>
<text x="1459" y="785" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="11" font-weight="400" text-anchor="middle">Native caption semantics</text>
<text x="754" y="837" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >Hover maximize → Windows Snap. Blank band → window move.</text>
<text x="754" y="860" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >Layout and DPI changes rebuild regions; controls never become drag traps.</text>
<path d="M48 921 L1552 921" stroke="#C2CBD3" stroke-width="1" fill="none" stroke-linecap="round" />
<text x="48" y="958" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="20" font-weight="600" >Quiet by default. Explicit when you act.</text>
<text x="48" y="988" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="400" >No permanent split targets. No animation on terminal output. No AI dashboard.</text>
<text x="48" y="1028" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" >Static design details — proposed interactions, not evidence of implemented native behavior.</text>
</svg>