name: Production actor deadline gate
on:
  push:
    branches: [diagnostic/shipping-deadline]
permissions:
  contents: read
concurrency:
  group: shipping-deadline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-ui:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize native MSVC toolchain
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Bootstrap pinned terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Cache successfully built terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - name: Configure actual production ABI baseline and candidate
        id: configure
        shell: pwsh
        run: |
          cmake -S . -B build-baseline -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DSTORMTTY_TEST_INK=OFF -DSTORMTTY_HIGH_RESOLUTION_ACTOR_DEADLINES=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build-candidate -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DSTORMTTY_TEST_INK=OFF -DSTORMTTY_HIGH_RESOLUTION_ACTOR_DEADLINES=ON
      - name: Build both production configurations without retries
        if: always() && steps.configure.outcome == 'success'
        shell: python
        run: |
          import subprocess,json,pathlib
          results={};root=pathlib.Path('artifacts');root.mkdir(exist_ok=True)
          for mode,targets in [('baseline',['session_tests','managed_shell_state_probe']),('candidate',['stormtty','session_tests','managed_shell_state_probe','actor_deadline_wait_tests','session_deadline_unsupported_tests','session_deadline_failure_tests','renderer_smoke','window_geometry_tests'])]:
            try: code=subprocess.run(['cmake','--build','build-'+mode,'--parallel','2','--target',*targets],timeout=600).returncode
            except (OSError,subprocess.TimeoutExpired): code=125
            results[mode]=code
          (root/'build-status.json').write_text(json.dumps(results))
          raise SystemExit(int(any(results.values())))
      - name: Production actor lifecycle, fallback and lost-wake tests
        if: always() && steps.configure.outcome == 'success'
        shell: python
        run: |
          import subprocess,json,pathlib
          results={}
          for mode,pattern in [('baseline','^session_tests$'),('candidate','^(session_tests|session_deadline_unsupported_tests|session_deadline_failure_tests|actor_deadline_wait_tests|renderer_smoke|window_geometry_tests)$')]:
            try: code=subprocess.run(['ctest','--test-dir','build-'+mode,'-R',pattern,'--no-tests=error','--output-on-failure','--output-junit',str(pathlib.Path('artifacts',mode+'-tests.xml').resolve())],timeout=600).returncode
            except (OSError,subprocess.TimeoutExpired): code=125
            results[mode]=code
          results['driver']=subprocess.run(['python','tools/probes/shipping-deadline-tests.py']).returncode
          pathlib.Path('artifacts/test-status.json').write_text(json.dumps(results))
          raise SystemExit(int(any(results.values())))
      - name: Exercise actual candidate app without provider changes
        if: always() && steps.configure.outcome == 'success'
        shell: python
        run: |
          import importlib.util,json,pathlib,sys,re
          spec=importlib.util.spec_from_file_location('owned',pathlib.Path('tools/run-owned-process.py'));m=importlib.util.module_from_spec(spec);sys.modules[spec.name]=m;spec.loader.exec_module(m)
          root=pathlib.Path('artifacts').resolve();failures=[]
          for mode in ['','-projects','-settings']:
            name='app'+(mode or '-typing')
            try:
              r=m.run_owned([str(pathlib.Path('build-candidate/stormtty.exe').resolve()),'--smoke'+mode,'--capture',str(root/(name+'.png'))],timeout=90,output_dir=root)
              (root/(name+'.log')).write_text(json.dumps(r.metadata())+'\n'+r.output_tail.decode('utf-8',errors='replace'))
              ok=r.exit_code==0 and r.reaped and not r.timed_out and not r.cleanup_error and not r.output_truncated
              counters=re.findall(r'Native actor deadline session=\d+ requested=(\d+) available=(\d+) waits=(\d+) timers=(\d+) spurious=(\d+) failures=(\d+)',r.output_tail.decode('utf-8',errors='replace'))
              ok=ok and bool(counters) and all(row[0:2]==('1','1') and row[4:6]==('0','0') for row in counters) and sum(int(row[2]) for row in counters)>0
            except OSError: ok=False
            if not ok: failures.append(name)
          (root/'app-status.json').write_text(json.dumps(failures));raise SystemExit(int(bool(failures)))
      - name: Stage exact pinned shell runtime
        id: shell
        if: always() && steps.configure.outcome == 'success'
        run: python tools/shell-bootstrap.py --destination .deps/deadline-shell --cache .cache/shell-bootstrap
      - name: Verify packaged provider hashes and signatures for explicit comparison only
        id: provider
        if: always() && steps.configure.outcome == 'success'
        shell: pwsh
        run: ./tools/prepare-conpty-probe.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'deadline-provider')
      - name: Same production fixture baseline and candidate on both providers
        if: always() && steps.shell.outcome == 'success' && steps.provider.outcome == 'success'
        shell: pwsh
        run: python tools/probes/run-shipping-deadline.py --baseline build-baseline --candidate build-candidate --runtime .deps/deadline-shell --provider (Join-Path $env:RUNNER_TEMP 'deadline-provider') --output artifacts/typing
      - name: Preserve all gates and real app captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shipping-deadline-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
