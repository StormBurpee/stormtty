# Isolated stages 1/2/3: synthetic + real bundled Zsh, never an app/default switch.
name: Private MSYS PTY bridge qualification
on:
  push:
    branches: [prototype/msys-pty-bridge]
permissions:
  contents: read
concurrency:
  group: msys-pty-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-broker:
    if: github.ref == 'refs/heads/prototype/msys-pty-bridge'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Prepare isolated evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'stormtty-pty-bridge'
          "BRIDGE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "$root/evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$root/evidence/commit.txt"
          Copy-Item tools/probes/msys-pty-bridge/README.md "$root/evidence/recipe.md"
          Copy-Item tools/shell-bootstrap.lock.json "$root/evidence/shell-bootstrap.lock.json"
          python tools/probes/msys-pty-bridge/qualification-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore download cache only (bootstrap revalidates bytes)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/shell-bootstrap
          key: shell-bootstrap-${{ runner.os }}-${{ hashFiles('tools/shell-bootstrap.lock.json', 'tools/shell-addons.lock.json', 'tools/shell-tools.lock.json') }}
      - name: Stage exact official untouched runtime without executing shells
        timeout-minutes: 15
        shell: pwsh
        run: |
          python tools/shell-bootstrap.py --destination "$env:BRIDGE_ROOT/original" --cache .cache/shell-bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:BRIDGE_ROOT/original/.stormtty-packages/msys2-runtime/.BUILDINFO" "$env:BRIDGE_ROOT/evidence/runtime-buildinfo.txt"
          Copy-Item "$env:BRIDGE_ROOT/original/.stormtty-packages/msys2-runtime/.PKGINFO" "$env:BRIDGE_ROOT/evidence/runtime-pkginfo.txt"
      - name: Verify exact complete runtime source identity
        timeout-minutes: 10
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['BRIDGE_ROOT'])
          target=root/'msys2-runtime-3.6.11-4.src.tar.zst'
          url='https://repo.msys2.org/msys/sources/'+target.name
          expected='4b178dfb5b77bce293706dcfabea673b77d8da061a4725bdf4cd94f17533c204'
          with urllib.request.urlopen(url,timeout=60) as response, target.open('xb') as out:
            size=0
            while chunk:=response.read(1024*1024):
              size+=len(chunk)
              if size>128907415: raise RuntimeError('Oversized source archive')
              out.write(chunk)
          with target.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert target.stat().st_size==128907415 and digest==expected
          (root/'evidence/runtime-source.txt').write_text(url+'\n'+digest+'\n',encoding='utf-8')
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Compile native owned-Job host (not ConPTY)
        timeout-minutes: 5
        shell: pwsh
        run: |
          cl /nologo /TC /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Bv tools/probes/msys-pty-bridge/host-windows.c "/Fe:$env:BRIDGE_ROOT/host.exe" "/Fo:$env:BRIDGE_ROOT/host.obj" /link /SUBSYSTEM:CONSOLE 2>&1 | Tee-Object "$env:BRIDGE_ROOT/evidence/native-compiler.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare temporary official MSYS build environment
        timeout-minutes: 15
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          location: ${{ runner.temp }}/stormtty-bridge-msys-toolchain
          update: true
          cache: false
          path-type: minimal
          # Helper command closure; do not rely on incidental base-devel installs.
          install: gcc zstd gnupg curl diffutils coreutils gawk grep sed tar binutils
      - name: Verify private exact GCC15 and compile synthetic broker
        id: compile
        timeout-minutes: 12
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$BRIDGE_ROOT")
          # bash/pacman/msys2-runtime belong to setup-msys2's base; the rest are
          # explicit packages above. Fail before downloads with the missing name.
          for tool in bash realpath dirname mkdir cp chmod sha256sum uname tee cmp awk grep sed tar zstd curl gpg pacman pacman-conf cygpath ldd as ld; do
            command -v "$tool" || { printf 'Missing required build tool: %s\n' "$tool" >&2; exit 127; }
          done > "$root/evidence/build-tools.txt"
          pacman -Q > "$root/evidence/build-environment.txt"
          bash tools/probes/msys-runtime-experiment/toolchain.sh "$root/gcc15" 2>&1 | tee "$root/evidence/private-compiler.txt"
          bash tools/probes/msys-pty-bridge/build-msys.sh "$root/gcc15/wrappers/stormtty-gcc-15" "$root/compiled" 2>&1 | tee "$root/evidence/broker-compile.txt"
          pacman -Q > "$root/evidence/build-environment-after.txt"
          cmp "$root/evidence/build-environment.txt" "$root/evidence/build-environment-after.txt"
      - name: Run each of six fixed modes once with owned cleanup
        if: success() && steps.compile.outcome == 'success'
        timeout-minutes: 5
        shell: pwsh
        run: |
          python tools/probes/msys-pty-bridge/qualify-windows.py --original "$env:BRIDGE_ROOT/original" --build "$env:BRIDGE_ROOT/compiled" --destination "$env:BRIDGE_ROOT/private-runtime" --host "$env:BRIDGE_ROOT/host.exe" --output "$env:BRIDGE_ROOT/evidence/cases"
          exit $LASTEXITCODE
      - name: Restore pinned engine for real VT feedback (stage 2 only)
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned terminal engine
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Build standalone real-VT stage 2 and native console fixture
        timeout-minutes: 10
        shell: pwsh
        run: |
          cmake -S tools/probes/msys-pty-bridge -B build-bridge-stage2 -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-bridge-stage2 --target bridge_stage2 bridge_managed --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /TC /std:c11 /W4 /WX /D_CRT_SECURE_NO_WARNINGS tools/probes/msys-pty-bridge/stage2-native.c "/Fe:$env:BRIDGE_ROOT/native-fixture.exe" "/Fo:$env:BRIDGE_ROOT/native-fixture.obj" /link /SUBSYSTEM:CONSOLE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real bundled Zsh plus native console child through actual VT adapter
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tools/probes/msys-pty-bridge/qualify-stage2.py --original "$env:BRIDGE_ROOT/original" --build "$env:BRIDGE_ROOT/compiled" --destination "$env:BRIDGE_ROOT/stage2-runtime" --host build-bridge-stage2/bridge_stage2.exe --native "$env:BRIDGE_ROOT/native-fixture.exe" --engine .deps/ghostty-native --output "$env:BRIDGE_ROOT/evidence/stage2"
          exit $LASTEXITCODE
      - name: Full shipped managed prompt and addons fresh then warm
        timeout-minutes: 4
        shell: pwsh
        run: |
          python tools/probes/msys-pty-bridge/qualify-stage3.py --original "$env:BRIDGE_ROOT/original" --build "$env:BRIDGE_ROOT/compiled" --destination "$env:BRIDGE_ROOT/stage3-runtime" --host build-bridge-stage2/bridge_managed.exe --native "$env:BRIDGE_ROOT/native-fixture.exe" --engine .deps/ghostty-native --output "$env:BRIDGE_ROOT/evidence/stage3"
          exit $LASTEXITCODE
      - name: Preserve failures and source provenance, not binaries or HOME
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msys-pty-bridge-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ env.BRIDGE_ROOT }}/evidence/*.txt
            ${{ env.BRIDGE_ROOT }}/evidence/*.json
            ${{ env.BRIDGE_ROOT }}/evidence/*.md
            ${{ env.BRIDGE_ROOT }}/evidence/cases/*.json
            ${{ env.BRIDGE_ROOT }}/evidence/cases/*.log
            ${{ env.BRIDGE_ROOT }}/evidence/stage2/*.json
            ${{ env.BRIDGE_ROOT }}/evidence/stage2/*.log
            ${{ env.BRIDGE_ROOT }}/evidence/stage3/*.json
            ${{ env.BRIDGE_ROOT }}/evidence/stage3/*.log
            ${{ env.BRIDGE_ROOT }}/compiled/*.txt
            ${{ env.BRIDGE_ROOT }}/gcc15/provenance/*.txt
            tools/probes/msys-pty-bridge/*.c
            tools/probes/msys-pty-bridge/*.cpp
            tools/probes/msys-pty-bridge/stage2.zshrc
            tools/probes/msys-pty-bridge/stage3-config.zsh
            tools/probes/msys-pty-bridge/*.sh
