<text x="137" y="522" fill="#ECEEF2" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="400" >Return to split layout</text>
<text x="137" y="539" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="11" font-weight="400" >Available while a pane is zoomed</text>
<path d="M95 562 L659 562" stroke="#464E5C" stroke-width="1" fill="none" stroke-linecap="round" />
<text x="107" y="585" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" >↑ ↓  Navigate</text>
<text x="647" y="585" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="end">Enter  Run command</text>
<text x="78" y="663" fill="#ECEEF2" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="600" >Ctrl+Shift+P</text>
<text x="78" y="689" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" >Opens instantly. Escape restores the prior input target.</text>
<text x="78" y="713" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" >Every action is searchable and remappable.</text>
<text x="754" y="146" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="18" font-weight="600" >Move a pane</text>
<text x="754" y="171" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >Only an intentional drag reveals placement targets.</text>
<rect x="754" y="195" width="798" height="350" rx="10" fill="#17191D" />
<rect x="754" y="195" width="798" height="34" rx="10" fill="#22252B" />
