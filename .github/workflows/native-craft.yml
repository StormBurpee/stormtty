name: Native craft review
on:
  push:
    branches: [feature/native-craft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-craft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-ui:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize native MSVC toolchain
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Bootstrap pinned terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Cache successfully built terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - name: Configure isolated native UI build
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DSTORMTTY_TEST_INK=OFF
      - name: Build native app and layout/renderer checks
        run: cmake --build build-ui --parallel 2 --target stormtty terminal_tests terminal_search_tests pane_context_tests command_watch_tests previous_terminal_tests session_write_accounting_tests window_geometry_tests core_commands_tests renderer_smoke ui_colors_tests context_menu_tests settings_panel_tests
      - name: Exercise native keyboard flow and capture craft states
        id: capture
        shell: python
        run: |
          import importlib.util,json,pathlib,sys,os
          spec=importlib.util.spec_from_file_location('owned_runner',pathlib.Path('tools/run-owned-process.py'))
          runner=importlib.util.module_from_spec(spec);sys.modules[spec.name]=runner;spec.loader.exec_module(runner)
          artifacts=pathlib.Path('build-ui/artifacts').resolve();artifacts.mkdir(parents=True,exist_ok=True)
          failures=[]
          for mode in ['projects','settings','layout']:
              result=runner.run_owned([str(pathlib.Path('build-ui/stormtty.exe').resolve()),'--smoke-'+mode,'--capture',str(artifacts/('craft-'+mode+'.png'))],timeout=90,output_dir=artifacts)
              log=result.output_tail.decode('utf-8',errors='replace')
              (artifacts/('craft-'+mode+'.log')).write_text(json.dumps(result.metadata(),sort_keys=True)+'\n'+log,encoding='utf-8')
              print(log,flush=True)
              if result.exit_code or not result.reaped or result.cleanup_error or result.timed_out or result.output_truncated: failures.append(mode)
              prepared=log.find('prepared_before_show=1 visible=0')
              exposed=log.find('first_exposed=1 prepared_before_show=1')
              scenario=log.find('Native motion sample=')
              if prepared<0 or exposed<=prepared or (scenario>=0 and scenario<exposed): failures.append(mode+'-startup-order')
              if mode=='settings' and 'Semantic UI capture: saved custom theme, settings closed, presented=1 motion_settled=1' not in log: failures.append('settings-semantic-capture')
              if mode=='settings':
                  if 'Native Settings scroll: raw wheel conversion, immediate response, finite burst/reversal, partial-control pointer hit, fractional direct input, horizontal consumption, zero/page policy and reduced-motion timer shutdown verified; synthetic_motion_policy=1 controlled_clock=1 native_present=1 physical_frame_pacing_verified=0.' not in log: failures.append('settings-scroll-proof')
                  for state in ['cancelled','saved-custom','reloaded']:
                      if 'Native menu theme capture=appearance-menu-'+state+' normal=1 narrow=1 palette=1 frontend_input_unchanged=1' not in log: failures.append('menu-theme-'+state)
              if mode=='layout' and 'Native command watch: explicit arm' not in log: failures.append('layout-command-watch')
              if mode=='layout' and 'Native pane context: three distinct owned actors' not in log: failures.append('layout-pane-context')
              if mode=='layout' and 'Native pane focus: identity_immediate=1 synthetic_normal_motion_interpolation=1 samples_ms=0,40,120 rapid_reversal=1 reduced_motion_cancellation=1 actors_bounds_grids_unchanged=1 frontend_input_unchanged=1 focus_protocol_writes_allowed=1 pane_motion_ended=1 shared_timer_accounted=1' not in log: failures.append('layout-pane-focus')
              if mode=='layout' and 'Native palette ownership smoke:' not in log: failures.append('layout-input-ownership')
              if mode=='settings' and 'Native Settings loading intent: held completion, Escape, immediate reopen and latest binding reuse same owned worker.' not in log: failures.append('settings-loading-intent')
              if mode=='settings' and 'Native theme gallery: nine preset cards, normal3/narrow2 columns' not in log: failures.append('theme-gallery')
              if mode=='layout' and 'Native background summary:' not in log: failures.append('background-summary')
              if mode=='projects' and 'Native background attention:' not in log: failures.append('background-attention')
              if mode=='projects' and 'Native previous-terminal smoke: committed cross-workspace/split/tab toggles, rename/move identity, preview/Escape focus invariants, parked/closed/dormant/stale rejection; zero frontend key/mouse input; automatic focus/protocol writes separately attributed.' not in log: failures.append('previous-terminal-completed')
              if mode=='projects' and 'Native previous-terminal retained exit: same exited actors navigable in both directions without spawn, input or restore.' not in log: failures.append('previous-terminal-retained-exit')
          expected=['commands','end','narrow','fuzzy','no-results','background']
          missing=[name for name in expected if not (artifacts/('craft-projects-palette-'+name+'.png')).is_file()]
          expected_startup=['craft-projects-startup-prepared.png','craft-projects-startup-exposed.png','craft-settings-startup-prepared.png','craft-settings-startup-exposed.png','craft-projects-workspace-focus-000ms.png']
          missing.extend(name for name in expected_startup if not (artifacts/name).is_file())
          expected_find=['results','next','narrow','empty']
          missing.extend('find-'+name for name in expected_find if not (artifacts/('craft-projects-find-'+name+'.png')).is_file())
          expected_navigator=['normal','preview','narrow-workspaces','narrow-terminals','empty']
          missing.extend('navigator-'+name for name in expected_navigator if not (artifacts/('craft-projects-navigator-'+name+'.png')).is_file())
          missing.extend(name for name in ['craft-layout-background-navigator.png','craft-projects-background-finished-navigator.png'] if not (artifacts/name).is_file())
          missing.extend('context-'+name for name in ['headers','inspect','narrow','high-contrast-fixture'] if not (artifacts/('craft-layout-context-'+name+'.png')).is_file())
          missing.extend('watch-'+name for name in ['armed','open-commands','indicator-narrow','indicator-high-contrast-fixture']+['result-'+str(i) for i in range(6)] if not (artifacts/('craft-layout-watch-'+name+'.png')).is_file())
          expected_gallery=['normal','narrow','high-contrast-fixture']
          missing.extend('gallery-'+name for name in expected_gallery if not (artifacts/('craft-settings-theme-gallery-'+name+'.png')).is_file())
          expected_previous_terminal=['craft-projects-previous-terminal-normal.png','craft-projects-previous-terminal-narrow.png']
          missing.extend(name for name in expected_previous_terminal if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n')
          expected_semantic=['craft-settings-appearance-blur-saved-reopened.png','craft-settings-appearance-shell-same-theme.png']
          missing.extend(name for name in expected_semantic if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n')
          expected_menus=['craft-settings-appearance-menu-'+state+'-'+size+'.png' for state in ['cancelled','saved-custom','reloaded'] for size in ['normal','narrow']]
          missing.extend(name for name in expected_menus if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n')
          expected_pane_focus=['craft-layout-pane-focus-'+sample+'.png' for sample in ['000ms','040ms','reversed-040ms','settled-160ms','settled-120ms','reduced-040ms']]
          missing.extend(name for name in expected_pane_focus if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n')
          expected_scroll=['craft-settings-settings-scroll-'+sample+'.png' for sample in ['first-000ms','intermediate-016ms','burst-032ms','reversed-048ms','settled-138ms','fractional-direct','reduced-motion-direct']]
          missing.extend(name for name in expected_scroll if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n')
          (artifacts/'manifest.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'ai_enabled':False,'required_palette_captures':expected,'required_semantic_captures':expected_semantic,'required_menu_theme_captures':expected_menus,'required_pane_focus_captures':expected_pane_focus,'required_settings_scroll_captures':expected_scroll,'settings_scroll_evidence':'synthetic controlled-time native presentation; not physical smoothness or frame-pacing verification','required_previous_terminal_captures':expected_previous_terminal,'missing':missing,'failed_modes':failures},indent=2),encoding='utf-8')
          if failures or missing: raise SystemExit(1)
      - name: Publish native screenshots immediately
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-craft-${{ github.sha }}
          path: build-ui/artifacts/
          if-no-files-found: error
      - name: Run layout and renderer checks
        if: always() && steps.capture.outcome != 'skipped'
        run: ctest --test-dir build-ui -R "^(terminal_tests|terminal_search_tests|pane_context_tests|command_watch_tests|previous_terminal_tests|session_write_accounting_tests|window_geometry_tests|core_commands_tests|renderer_smoke|ui_colors_tests|context_menu_tests|settings_panel_tests)$" --no-tests=error --output-on-failure --output-junit focused-tests.xml
      - name: Require normal and narrow Settings clipping rasters
        if: always() && steps.capture.outcome != 'skipped'
        shell: python
        run: |
          import json,os,pathlib
          artifacts=pathlib.Path('build-ui/artifacts')
          expected=['settings-scroll-'+size+'-fractional-'+str(percent)+'pct.png' for size in ['normal','narrow'] for percent in [100,125,150]]
          missing=[name for name in expected if not (artifacts/name).is_file() or (artifacts/name).read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n']
          (artifacts/'settings-scroll-raster-manifest.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'required_settings_viewport_rasters':expected,'missing':missing,'evidence':'Windows WARP offscreen pixel clipping; not physical smoothness'},indent=2),encoding='utf-8')
          if missing: raise SystemExit('Missing Settings viewport rasters: '+', '.join(missing))
      - name: Preserve focused test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-craft-tests-${{ github.sha }}
          path: |
            build-ui/focused-tests.xml
            build-ui/Testing/Temporary/LastTest.log
            build-ui/CMakeFiles/CMakeConfigureLog.yaml
            build-ui/artifacts/settings-scroll-*-fractional-*pct.png
            build-ui/artifacts/settings-scroll-raster-manifest.json
          if-no-files-found: warn
