# Isolated source-build experiment; never replaces a shipped runtime.
name: Private MSYS stock versus conditional retirement experiment
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/msys-conditional-retirement.yml'
      - 'tools/probes/msys-runtime-experiment/**'
      - '.gitattributes'
permissions:
  contents: read
concurrency:
  group: msys-conditional-retirement-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'experiment/msys-conditional-retirement' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Exact reviewed experiment commit, not the synthetic PR merge tree.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Prepare evidence and record fixed candidate
        shell: pwsh
        run: |
          $env:EXPERIMENT_ROOT = Join-Path $env:RUNNER_TEMP "stormtty-runtime-conditional"
          "EXPERIMENT_ROOT=$env:EXPERIMENT_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "$env:EXPERIMENT_ROOT/evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$env:EXPERIMENT_ROOT/evidence/commit.txt"
          Copy-Item tools/probes/msys-runtime-experiment/CONDITIONAL-PLAN.md "$env:EXPERIMENT_ROOT/evidence/experiment-recipe.md"
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Build one immutable qualification probe
        timeout-minutes: 15
        shell: pwsh
        run: |
          $probeHash = (Get-FileHash tests/paste_input_probe.cpp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($probeHash -ne '251477c3587c25b498bf1bf099e355d47a2cf3e1b8f1dcd7649e406aca39beae') { throw 'PR7 raw probe/classifier drift' }
          # Windows probe automatically links separate qualification-only libraries.
          cmake -S . -B build-msys-conditional -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-msys-conditional --target paste_input_probe bundled_shell_probe stormtty qualification_input_evidence_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-msys-conditional --output-on-failure -R "^qualification_input_evidence_tests$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/check_input_evidence_isolation.py build-msys-conditional
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tooling and stage untouched private bundle
        timeout-minutes: 15
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/stage-conditional-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/conditional-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/conditional-identity-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/conditional-model-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/shell-bootstrap.py --destination "$env:EXPERIMENT_ROOT/original" --cache .cache/shell-bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:EXPERIMENT_ROOT/original/.stormtty-packages/msys2-runtime/.BUILDINFO" "$env:EXPERIMENT_ROOT/evidence/upstream-buildinfo.txt"
          ./tools/prepare-conpty-probe.ps1 -Destination "$env:EXPERIMENT_ROOT/conpty"
      - name: Download exact official complete source archive
        timeout-minutes: 10
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['EXPERIMENT_ROOT'])
          target=root/'msys2-runtime-3.6.11-4.src.tar.zst'
          url='https://repo.msys2.org/msys/sources/'+target.name
          expected='4b178dfb5b77bce293706dcfabea673b77d8da061a4725bdf4cd94f17533c204'
          with urllib.request.urlopen(url,timeout=60) as response, target.open('xb') as out:
            size=0
            while chunk:=response.read(1024*1024):
              size+=len(chunk)
              if size>128907415: raise RuntimeError('Oversized source archive')
              out.write(chunk)
          with target.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert target.stat().st_size==128907415 and digest==expected
          (root/'evidence/source-identity.txt').write_text(url+'\n'+digest+'\n',encoding='utf-8')
      - name: Install isolated official native MSYS build environment
        timeout-minutes: 20
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0, verified official action
        with:
          msystem: MSYS
          location: ${{ runner.temp }}/stormtty-msys-toolchain
          update: true
          cache: false
          path-type: minimal
          install: >-
            base-devel autotools cocom docbook-xsl gcc gettext-devel git
            libzstd-devel libiconv-devel mingw-w64-cross-crt mingw-w64-cross-gcc
            mingw-w64-cross-zlib perl xmlto zlib-devel zstd texinfo
      - name: Verify and preflight private GCC15 compiler (no system downgrade)
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          bash tools/probes/msys-runtime-experiment/toolchain.sh "$root/gcc15" 2>&1 | tee "$root/evidence/gcc15-preflight.log"
      - name: Build stock runtime from official source and all packaging patches
        id: stock
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/build-conditional.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/stock-build" stock 2>&1 | tee "$root/evidence/stock-build.log"
      - name: Build conditional retirement runtime with identical toolchain
        id: conditional
        if: always() && steps.stock.outcome == 'success'
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/build-conditional.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/conditional-build" conditional 2>&1 | tee "$root/evidence/conditional-build.log"
          cmp "$root/stock-build/provenance/pacman-before.txt" "$root/conditional-build/provenance/pacman-before.txt"
      - name: Stage experimental copies without touching active runtime
        id: staging
        if: always() && steps.conditional.outcome == 'success'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/stage-conditional.py "$env:EXPERIMENT_ROOT/original" "$env:EXPERIMENT_ROOT/stock-build" "$env:EXPERIMENT_ROOT/stock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/stage-conditional.py "$env:EXPERIMENT_ROOT/original" "$env:EXPERIMENT_ROOT/conditional-build" "$env:EXPERIMENT_ROOT/conditional"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fixed unchanged PR7 raw paste matrix (three trials per variant/provider)
        id: raw
        if: always() && steps.staging.outcome == 'success'
        timeout-minutes: 42
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/compare-conditional.py --probe build-msys-conditional/paste_input_probe.exe --app build-msys-conditional/stormtty.exe --original "$env:EXPERIMENT_ROOT/original" --stock "$env:EXPERIMENT_ROOT/stock" --conditional "$env:EXPERIMENT_ROOT/conditional" --provider "$env:EXPERIMENT_ROOT/conpty" --output "$env:EXPERIMENT_ROOT/evidence/raw" --workload raw
          exit $LASTEXITCODE
      - name: Fixed actual settings-close paste matrix (twelve fresh launches)
        id: settings
        if: always() && steps.staging.outcome == 'success'
        timeout-minutes: 9
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/compare-conditional.py --probe build-msys-conditional/paste_input_probe.exe --app build-msys-conditional/stormtty.exe --original "$env:EXPERIMENT_ROOT/original" --stock "$env:EXPERIMENT_ROOT/stock" --conditional "$env:EXPERIMENT_ROOT/conditional" --provider "$env:EXPERIMENT_ROOT/conpty" --output "$env:EXPERIMENT_ROOT/evidence/settings" --workload settings
          exit $LASTEXITCODE
      - name: Preserve all fixed trials and source provenance (no DLL distribution)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msys-conditional-retirement-${{ github.sha }}
          if-no-files-found: warn
          # Fixed synthetic raw payload/CPR hex and isolated smoke diagnostics only.
          # Never upload DLLs/packages, scratch HOME/history, captures or keyrings.
          path: |
            ${{ env.EXPERIMENT_ROOT }}/evidence/*.txt
            ${{ env.EXPERIMENT_ROOT }}/evidence/*.md
            ${{ env.EXPERIMENT_ROOT }}/evidence/*-build.log
            ${{ env.EXPERIMENT_ROOT }}/evidence/gcc15-preflight.log
            ${{ env.EXPERIMENT_ROOT }}/evidence/raw/results.json
            ${{ env.EXPERIMENT_ROOT }}/evidence/raw/*.log
            ${{ env.EXPERIMENT_ROOT }}/evidence/settings/results.json
            ${{ env.EXPERIMENT_ROOT }}/evidence/settings/*.log
            ${{ env.EXPERIMENT_ROOT }}/gcc15/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/*.patch
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/*.cc
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/*.before
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/*.after
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/makepkg.conf
            ${{ env.EXPERIMENT_ROOT }}/stock-build/provenance/PKGBUILD
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/*.patch
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/*.cc
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/*.before
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/*.after
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/makepkg.conf
            ${{ env.EXPERIMENT_ROOT }}/conditional-build/provenance/PKGBUILD
