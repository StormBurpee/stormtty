# Root-owned intentional source pushes on this diagnostic branch qualify.
# Never push unchanged retries until green; no main/PR/dispatch trigger.
name: Opt-in shipping completion seed qualification
on:
  push:
    branches: [diagnostic/completion-seed-shipping]
permissions:
  contents: read
concurrency:
  group: completion-seed-shipping-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/completion-seed-shipping'
    runs-on: windows-2025
    timeout-minutes: 100
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare owned evidence directory
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA ("StormTTY shipping seed " + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path "$root/evidence" | Out-Null
          "SHIPPING_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git rev-parse HEAD | Set-Content "$root/evidence/commit.txt"
      - name: Check packaging and numeric evidence contracts
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tools/stage-developer-shell-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare-bundled-completion-seed-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/completion-seed-build-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/shipping-completion-seed-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/shipping-seed-workflow-tests.py
          exit $LASTEXITCODE
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore exact terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine once
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: pwsh
        run: |
          python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2 2>&1 | Tee-Object "$env:SHIPPING_ROOT/evidence/engine.log"
          exit $LASTEXITCODE
      - name: Stage exact current runtime and provider
        timeout-minutes: 12
        shell: pwsh
        run: |
          python tools/shell-bootstrap.py --destination "$env:SHIPPING_ROOT/source-runtime" --cache .cache/shell-bootstrap 2>&1 | Tee-Object "$env:SHIPPING_ROOT/evidence/staging.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/prepare-conpty-probe.ps1 -Destination "$env:SHIPPING_ROOT/conpty"
          exit $LASTEXITCODE
      - name: Build application and probes with explicit experimental opt-in
        timeout-minutes: 20
        shell: pwsh
        run: |
          cmake -S . -B "$env:SHIPPING_ROOT/build" -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUNDLE_CONPTY=OFF -DSTORMTTY_EXPERIMENTAL_COMPLETION_SEED=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native" "-DSTORMTTY_DEVELOPER_SHELL_RUNTIME=$env:SHIPPING_ROOT/source-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:SHIPPING_ROOT/build" --target stormtty managed_shell_startup_probe managed_shell_initialization_probe --parallel 2 2>&1 | Tee-Object "$env:SHIPPING_ROOT/evidence/build.log"
          exit $LASTEXITCODE
      - name: Prove owned no-op repair and install the exact anchored runtime
        timeout-minutes: 8
        shell: python
        run: |
          import hashlib, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['SHIPPING_ROOT'])
          build=root/'build'
          header=build/'generated/completion-seed/stormtty_completion_seed_trust.hpp'
          before=hashlib.sha256(header.read_bytes()).hexdigest()
          with (root/'evidence/packaging.log').open('wb') as log:
              subprocess.run(['cmake','--build',str(build),'--target','stormtty_completion_seed_package','--parallel','2'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=180)
              assert hashlib.sha256(header.read_bytes()).hexdigest()==before
              # Delete only an owned generated header, not user/runtime data.
              header.unlink()
              subprocess.run(['cmake','--build',str(build),'--target','stormtty_completion_seed_package','--parallel','2'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=180)
              assert hashlib.sha256(header.read_bytes()).hexdigest()==before
              subprocess.run(['cmake','--install',str(build),'--prefix',str(root/'portable with spaces é')],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=240)
      - name: Qualify lifecycle and actual installed shipping startup once
        timeout-minutes: 31
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['SHIPPING_ROOT'])
          with (root/'evidence/driver.log').open('wb') as log:
              try:
                  result=subprocess.run([sys.executable,'tools/probes/run-shipping-completion-seed.py',
                      '--build',str(root/'build'),'--install',str(root/'portable with spaces é'),
                      '--provider',str(root/'conpty'),'--output',str(root/'evidence')],stdout=log,stderr=subprocess.STDOUT,timeout=1800)
                  code=result.returncode
              except subprocess.TimeoutExpired:
                  log.write(b'SHIPPING_OUTER_TIMEOUT code=124\n');code=124
          print((root/'evidence/driver.log').read_text(encoding='utf-8',errors='replace'))
          raise SystemExit(code)
      - name: Always retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion-seed-shipping-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.SHIPPING_ROOT }}/evidence/*.log
            ${{ env.SHIPPING_ROOT }}/evidence/*.json
            ${{ env.SHIPPING_ROOT }}/evidence/commit.txt
            ${{ env.SHIPPING_ROOT }}/evidence/shipping-settings.png
