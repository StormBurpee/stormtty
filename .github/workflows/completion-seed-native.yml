# One deliberate root-owned push starts this isolated qualification. No retry pushes.
name: Native pristine completion seed qualification
on:
  push:
    branches: [diagnostic/completion-seed-native]
    paths: [.github/workflows/completion-seed-native.yml]
permissions:
  contents: read
concurrency:
  group: completion-seed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/completion-seed-native'
    runs-on: windows-2025
    timeout-minutes: 80
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare bounded evidence directory
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'stormtty-completion-seed'
          New-Item -ItemType Directory -Force -Path "$root/evidence", "$root/scratch" | Out-Null
          "SEED_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git rev-parse HEAD | Set-Content "$root/evidence/commit.txt"
      - name: Check diagnostic contracts
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tools/probes/completion-seed-workflow-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/completion-seed-build-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/managed-source-profile-tests.py
          exit $LASTEXITCODE
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore exact pinned terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine once
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: pwsh
        run: |
          python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2 2>&1 | Tee-Object -FilePath "$env:SEED_ROOT/evidence/engine-build.log"
          exit $LASTEXITCODE
      - name: Build one optional native measurement probe
        timeout-minutes: 12
        shell: pwsh
        run: |
          cmake -S . -B build-seed -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-seed --target managed_shell_startup_probe --parallel 2 2>&1 | Tee-Object -FilePath "$env:SEED_ROOT/evidence/build.log"
          exit $LASTEXITCODE
      - name: Stage unchanged pinned runtime and packaged provider
        timeout-minutes: 12
        shell: pwsh
        run: |
          python tools/shell-bootstrap.py --destination "$env:SEED_ROOT/runtime" --cache .cache/shell-bootstrap 2>&1 | Tee-Object -FilePath "$env:SEED_ROOT/evidence/staging.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/prepare-conpty-probe.ps1 -Destination "$env:SEED_ROOT/conpty"
          exit $LASTEXITCODE
      - name: Qualify baseline and seeded fresh and warm startup once
        timeout-minutes: 26
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['SEED_ROOT'])
          # Outer hard bound covers fixture preparation as well as all individually
          # owned native children. No time-based pass/fail speed threshold.
          with (root/'evidence/driver.log').open('wb') as log:
              try:
                  result = subprocess.run([sys.executable, 'tools/probes/run-completion-seed.py',
                      '--runtime', str(root/'runtime'), '--probe', str(pathlib.Path('build-seed/managed_shell_startup_probe.exe').resolve()),
                      '--provider', str(root/'conpty'), '--output', str(root/'evidence'), '--scratch', str(root/'scratch')],
                      stdout=log, stderr=subprocess.STDOUT, timeout=1500)
                  code = result.returncode
              except subprocess.TimeoutExpired:
                  log.write(b'SEED_OUTER_TIMEOUT code=124\n')
                  code = 124
          print((root/'evidence/driver.log').read_text(encoding='utf-8', errors='replace'))
          raise SystemExit(code)
      - name: Always preserve sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion-seed-native-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          # Never upload runtime, executable seed, HOME/state or raw zprof.
          path: |
            ${{ env.SEED_ROOT }}/evidence/*.log
            ${{ env.SEED_ROOT }}/evidence/*.json
            ${{ env.SEED_ROOT }}/evidence/commit.txt
