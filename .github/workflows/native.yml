name: Native build and runtime evidence
on:
  push:
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Ink fixture dependencies
        run: npm ci --prefix tests/ink --ignore-scripts --no-audit --no-fund
      - name: Reject noninteractive Ink false positives
        run: npm test --prefix tests/ink
      - name: Initialize Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Install macOS C++20 toolchain
        if: runner.os == 'macOS'
        run: brew install llvm@20
      - name: Restore pinned terminal engine
        id: engine_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Bootstrap pinned terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Cache successfully built terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - name: Check bootstrap boundary tests
        run: python -m unittest discover -s tools -p 'bootstrap_test*.py' -v
      - name: Configure native Windows application
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_INK=ON
      - name: Configure portable core and native POSIX transport
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=OFF -DSTORMTTY_TEST_INK=ON
      - name: Configure native macOS application
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/MacOSLLVM.cmake -DSTORMTTY_LLVM_ROOT="$(brew --prefix llvm@20)" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_INK=ON
      - name: Build
        id: build
        run: cmake --build build --parallel 2
      - name: Run real native tests
        id: native_tests
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml --parallel 1
      - name: Diagnose Windows Ink transport boundary
        if: always() && runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: python
        run: |
          import pathlib,subprocess,shutil,base64,hashlib
          capture=pathlib.Path('build/artifacts/ink-transport').resolve()
          probe=subprocess.run([str(pathlib.Path('build/ink_session_tests.exe').resolve()),shutil.which('node'),str(pathlib.Path('tests/ink/fixture.mjs').resolve()),'transport-probe',str(capture)])
          reference=pathlib.Path('build/ink-reference').resolve()
          install=subprocess.run([shutil.which('npm'), 'install','--prefix',str(reference),'--ignore-scripts','--no-audit','--no-fund','--save-exact','@xterm/headless@6.0.0','@xterm/addon-unicode11@0.9.0'],shell=True)
          replay=1
          if install.returncode == 0:
            replay=subprocess.run([shutil.which('node'),'tests/ink/replay-transport.cjs',str(reference/'node_modules/@xterm/headless'),str(capture)]).returncode
          for p in sorted(capture.glob('*.bin')):
            if p.name.endswith('-live.bin'): continue
            b=p.read_bytes()
            if len(b)>1024*1024: raise RuntimeError('Capture too large')
            print('INK_CAPTURE_NAME='+p.name,flush=True)
            print('INK_CAPTURE_SHA256='+hashlib.sha256(b).hexdigest(),flush=True)
            print('INK_CAPTURE_BASE64_BEGIN',flush=True)
            data=base64.b64encode(b).decode()
            for i in range(0,len(data),4096): print(data[i:i+4096],flush=True)
            print('INK_CAPTURE_BASE64_END',flush=True)
          raise SystemExit(1 if probe.returncode or install.returncode or replay else 0)
      - name: Verify explicit packaged console dependency
        id: packaged_console
        if: always() && runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: pwsh
        run: ./tools/prepare-conpty-probe.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'stormtty-conpty-qualified')
      - name: Compare packaged console without changing defaults
        if: always() && runner.os == 'Windows' && steps.packaged_console.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess,shutil
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          base=[str(pathlib.Path('build/ink_session_tests.exe').resolve()),shutil.which('node'),str(pathlib.Path('tests/ink/fixture.mjs').resolve())]
          failures=[]
          cases=['provider-missing-host','static-margin-probe','primary','fullscreen','compact-alt','host-close','transport-probe']
          for case in cases:
            args=base+[case]
            if case=='transport-probe': args.append(str(pathlib.Path('build/artifacts/ink-packaged-transport').resolve()))
            args+=['--packaged-provider',str(provider/'missing-host' if case=='provider-missing-host' else provider)]
            print('PACKAGED_CONSOLE_CASE='+case,flush=True)
            result=subprocess.run(args,timeout=120)
            print('PACKAGED_CONSOLE_RESULT='+case+':'+str(result.returncode),flush=True)
            if result.returncode: failures.append(case)
          print('Packaged comparison failures: '+repr(failures),flush=True)
          raise SystemExit(1 if failures else 0)
      - name: Collect targeted macOS GUI failure evidence
        if: always() && runner.os == 'macOS' && steps.build.outcome == 'success' && steps.native_tests.outcome == 'failure'
        run: python tools/macos-crash-evidence.py
      - name: Record native frame for review
        if: always() && runner.os == 'Windows'
        shell: python
        run: |
          import pathlib,base64,hashlib
          for name in ('native-window.png', 'native-layout.png', 'native-modal.png', 'native-projects.png', 'native-settings.png'):
            p=pathlib.Path('build/artifacts')/name
            print('STORMTTY_NATIVE_FRAME_NAME='+name)
            if p.exists():
              b=p.read_bytes()
              print('STORMTTY_NATIVE_FRAME_SHA256='+hashlib.sha256(b).hexdigest())
              print('STORMTTY_NATIVE_FRAME_BASE64_BEGIN')
              s=base64.b64encode(b).decode()
              for i in range(0,len(s),4096): print(s[i:i+4096])
              print('STORMTTY_NATIVE_FRAME_BASE64_END')
            else: print('Native frame unavailable; do not claim visual verification.')
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/artifacts/*.png
            build/artifacts/macos-debugger.log
            build/artifacts/stormtty-crash.*
            build/artifacts/ink-transport/*.bin
            build/artifacts/ink-packaged-transport/*.bin
            .deps/ghostty-native/stormtty-build.json
            .deps/ghostty-native/stormtty-bootstrap.lock.json
          if-no-files-found: warn
