# One-shot observation only; never replaces the production-linked session gate.
name: Isolated final-frame disposal diagnostic
on:
  push:
    branches: [diagnostic/session-final-disposal]
    paths:
      - .github/workflows/session-disposal-diagnostic.yml
      - CMakeLists.txt
      - include/stormtty/session.hpp
      - src/session/session.cpp
      - tests/session_tests.cpp
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: session-disposal-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Build isolated diagnostic only
        shell: pwsh
        run: |
          cmake -S . -B build-session-diagnostic -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DSTORMTTY_BUILD_APP=OFF -DSTORMTTY_SESSION_DISPOSAL_DIAGNOSTICS=ON "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-session-diagnostic --target session_disposal_diagnostics --parallel 2
          exit $LASTEXITCODE
      - name: Run synthetic test sequence exactly once
        shell: python
        run: |
          import importlib.util, json, os, pathlib, sys
          spec = importlib.util.spec_from_file_location('owned_runner', pathlib.Path('tools/run-owned-process.py'))
          runner = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = runner
          spec.loader.exec_module(runner)
          build = pathlib.Path('build-session-diagnostic').resolve()
          artifacts = build / 'artifacts'
          artifacts.mkdir(exist_ok=True)
          provenance = {'head': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                        'attempts': 1, 'outer_timeout_seconds': 90,
                        'fixture_wait_seconds': 10, 'scope': 'diagnostic observation, not production qualification'}
          (artifacts / 'provenance.json').write_text(json.dumps(provenance, indent=2), encoding='utf-8')
          # Same 90-second outer limit as stormtty_test; the in-test wait stays 10s.
          result = runner.run_owned([str(build / 'session_disposal_diagnostics.exe')],
                                    timeout=90, cwd=build, output_dir=artifacts)
          (artifacts / 'session-disposal.log').write_bytes(result.output_tail)
          (artifacts / 'owned-process.json').write_text(json.dumps(result.metadata(), indent=2), encoding='utf-8')
          print(result.output_tail.decode('utf-8', errors='replace'), flush=True)
          print(json.dumps(result.metadata(), sort_keys=True), flush=True)
          # No retry or conversion of test/runner failure to success.
          raise SystemExit(result.exit_code or int(not result.reaped or result.output_truncated or bool(result.cleanup_error)))
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-disposal-diagnostic-${{ github.sha }}
          path: |
            build-session-diagnostic/artifacts/
            build-session-diagnostic/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
