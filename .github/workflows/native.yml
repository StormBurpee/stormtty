name: Native build and runtime evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Bootstrap pinned terminal engine
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Check bootstrap boundary tests
        run: python -m unittest discover -s tools -p 'bootstrap_test*.py' -v
      - name: Configure native Windows application
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON
      - name: Configure portable core and native POSIX transport
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run real native tests
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml --parallel 1
      - name: Record native frame for review
        if: always() && runner.os == 'Windows'
        shell: python
        run: |
          import pathlib,base64,hashlib
          p=pathlib.Path('build/artifacts/native-window.png')
          if p.exists():
            b=p.read_bytes()
            print('STORMTTY_NATIVE_FRAME_SHA256='+hashlib.sha256(b).hexdigest())
            print('STORMTTY_NATIVE_FRAME_BASE64_BEGIN')
            s=base64.b64encode(b).decode()
            for i in range(0,len(s),4096): print(s[i:i+4096])
            print('STORMTTY_NATIVE_FRAME_BASE64_END')
          else: print('Native frame unavailable; do not claim visual verification.')
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/artifacts/*.png
            .deps/ghostty-native/stormtty-build.json
            .deps/ghostty-native/stormtty-bootstrap.lock.json
          if-no-files-found: warn
