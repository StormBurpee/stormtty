# BUILD/EVIDENCE ONLY. Runtime phase requires root review of actual native code.
# Parser correction: accept CRLF native text while hashing original bytes.
# No fixtures run here; successful job does not mean async-signal/path qualification.
name: Private MSYS passive build and static evidence
on:
  # One intentional publication commit only. Do not push workflow edits to
  # retry failures; preserve failures and stop for review.
  push:
    branches: ['experiment/msys-passive-build']
    paths: ['.github/workflows/msys-passive-build.yml']
permissions:
  contents: read
concurrency:
  group: msys-passive-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/msys-passive-build'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Exact intentionally pushed experiment commit; never the PR merge tree.
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Prepare evidence and record fixed candidate
        shell: pwsh
        run: |
          $env:EXPERIMENT_ROOT = Join-Path $env:RUNNER_TEMP "stormtty-runtime-passive-build"
          "EXPERIMENT_ROOT=$env:EXPERIMENT_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "$env:EXPERIMENT_ROOT/evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$env:EXPERIMENT_ROOT/evidence/commit.txt"

      - name: Validate build-only workflow and portable diagnostic contracts
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($test in @('tests.py','runner-tests.py','stage-tests.py','build-evidence-tests.py')) {
            python "tools/probes/msys-runtime-experiment/passive-path/$test"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Download exact official complete source archive
        timeout-minutes: 10
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['EXPERIMENT_ROOT'])
          target=root/'msys2-runtime-3.6.11-4.src.tar.zst'
          url='https://repo.msys2.org/msys/sources/'+target.name
          expected='4b178dfb5b77bce293706dcfabea673b77d8da061a4725bdf4cd94f17533c204'
          with urllib.request.urlopen(url,timeout=60) as response, target.open('xb') as out:
            size=0
            while chunk:=response.read(1024*1024):
              size+=len(chunk)
              if size>128907415: raise RuntimeError('Oversized source archive')
              out.write(chunk)
          with target.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert target.stat().st_size==128907415 and digest==expected
          (root/'evidence/source-identity.txt').write_text(url+'\n'+digest+'\n',encoding='utf-8')
      - name: Install isolated official native MSYS build environment
        timeout-minutes: 20
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0, verified official action
        with:
          msystem: MSYS
          location: ${{ runner.temp }}/stormtty-msys-toolchain
          update: true
          cache: false
          path-type: minimal
          install: >-
            base-devel autotools cocom docbook-xsl gcc gettext-devel git
            libzstd-devel libiconv-devel mingw-w64-cross-crt mingw-w64-cross-gcc
            mingw-w64-cross-zlib perl xmlto zlib-devel zstd texinfo diffutils coreutils gawk grep sed tar binutils curl gnupg python
      - name: Verify and preflight private GCC15 compiler (no system downgrade)
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          bash tools/probes/msys-runtime-experiment/toolchain.sh "$root/gcc15" 2>&1 | tee "$root/evidence/gcc15-preflight.log"
      - name: Build stock diagnostic runtime and verify static evidence
        id: stock
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/passive-path/build.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/stock-build" stock 2>&1 | tee "$root/evidence/stock-build.log"
      - name: Build refined diagnostic runtime with identical observer and toolchain
        id: refined
        if: always() && steps.stock.outcome == 'success'
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/passive-path/build.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/refined-build" refined 2>&1 | tee "$root/evidence/refined-build.log"
          cmp "$root/stock-build/provenance/pacman-before.txt" "$root/refined-build/provenance/pacman-before.txt"
      - name: Collect bounded allowlisted build evidence even on failure
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/passive-path/collect-evidence.py "$env:EXPERIMENT_ROOT" "$env:EXPERIMENT_ROOT/review-packet"
          exit $LASTEXITCODE
      - name: Preserve static review packet only (no runtime fixtures or binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msys-passive-build-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ env.EXPERIMENT_ROOT }}/review-packet/
