<text x="1410" y="377" fill="#ECEEF2" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Split right</text>
<text x="1410" y="402" fill="#A4ADB9" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="middle">Drop to place pane</text>
<rect x="1194" y="280" width="184" height="32" rx="6" fill="#30343D" stroke="#464E5C" stroke-width="1" filter="url(#shadow)"/>
<text x="1207" y="301" fill="#ECEEF2" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >stormtty</text>
<path d="M1349 302 l0 -18 13 13 -8 0 -3 8 z" stroke="#ECEEF2" stroke-width="1.3" fill="#17191D" stroke-linecap="round" stroke-linejoin="round"/>
<text x="754" y="579" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="600" >No invisible outcome.</text>
<text x="754" y="602" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >The preview is the future rectangle. Center means Swap; Escape cancels.</text>
<text x="754" y="659" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="18" font-weight="600" >Chrome hit map</text>
<text x="754" y="684" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >Illustrative regions; caption bounds and resize borders use system metrics.</text>
<rect x="754" y="706" width="798" height="98" rx="8" fill="#22252B" />
<rect x="768" y="720" width="180" height="40" rx="5" fill="#30343D" />
