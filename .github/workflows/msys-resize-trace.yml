# Isolated source-build experiment; never replaces a shipped runtime.
name: Private MSYS resize observation trace
on:
  push:
    branches: ['experiment/msys-resize-trace']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: msys-resize-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/experiment/msys-resize-trace'
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Prepare evidence and record fixed candidate
        shell: pwsh
        run: |
          $env:EXPERIMENT_ROOT = Join-Path $env:RUNNER_TEMP "stormtty-runtime-trace"
          "EXPERIMENT_ROOT=$env:EXPERIMENT_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Path "$env:EXPERIMENT_ROOT/evidence" | Out-Null
          git rev-parse HEAD | Set-Content "$env:EXPERIMENT_ROOT/evidence/commit.txt"
          Copy-Item tools/probes/msys-runtime-experiment/TRACE-PLAN.md "$env:EXPERIMENT_ROOT/evidence/experiment-recipe.md"
          # Fail before expensive builds if this runner's actual TEMP root cannot
          # satisfy the runtime's explicit drive-path bound (UTF-16 units).
          $longest = 0
          foreach ($workload in @('idle','repeated')) {
            foreach ($provider in @('inbox','packaged')) {
              foreach ($variant in @('original','control','instrumented')) {
                $relative = "evidence/$workload/1-$workload-$provider-$variant-runtime-trace"
                $trace = [IO.Path]::GetFullPath((Join-Path $env:EXPERIMENT_ROOT $relative))
                if ($trace.Length -ge 180 -or $trace -notmatch '^[A-Za-z]:\\') {
                  throw "Invalid native trace destination ($($trace.Length) UTF-16 units): $trace"
                }
                $longest = [Math]::Max($longest, $trace.Length)
              }
            }
          }
          "max_native_trace_path_utf16=$longest limit_exclusive=180" | Tee-Object -FilePath "$env:EXPERIMENT_ROOT/evidence/trace-path-preflight.txt"
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Build one immutable qualification probe
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Windows probe automatically links separate qualification-only libraries.
          cmake -S . -B build-msys-trace -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-msys-trace --target bundled_shell_probe stormtty qualification_input_evidence_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-msys-trace --output-on-failure -R "^qualification_input_evidence_tests$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/check_input_evidence_isolation.py build-msys-trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tooling and stage untouched private bundle
        timeout-minutes: 15
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/stage-trace-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/compare-trace-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/trace-workflow-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/shell-bootstrap.py --destination "$env:EXPERIMENT_ROOT/original" --cache .cache/shell-bootstrap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:EXPERIMENT_ROOT/original/.stormtty-packages/msys2-runtime/.BUILDINFO" "$env:EXPERIMENT_ROOT/evidence/upstream-buildinfo.txt"
          ./tools/prepare-conpty-probe.ps1 -Destination "$env:EXPERIMENT_ROOT/conpty"
      - name: Download exact official complete source archive
        timeout-minutes: 10
        shell: python
        run: |
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['EXPERIMENT_ROOT'])
          target=root/'msys2-runtime-3.6.11-4.src.tar.zst'
          url='https://repo.msys2.org/msys/sources/'+target.name
          expected='4b178dfb5b77bce293706dcfabea673b77d8da061a4725bdf4cd94f17533c204'
          with urllib.request.urlopen(url,timeout=60) as response, target.open('xb') as out:
            size=0
            while chunk:=response.read(1024*1024):
              size+=len(chunk)
              if size>128907415: raise RuntimeError('Oversized source archive')
              out.write(chunk)
          with target.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert target.stat().st_size==128907415 and digest==expected
          (root/'evidence/source-identity.txt').write_text(url+'\n'+digest+'\n',encoding='utf-8')
      - name: Install isolated official native MSYS build environment
        timeout-minutes: 20
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0, verified official action
        with:
          msystem: MSYS
          location: ${{ runner.temp }}/stormtty-msys-toolchain
          update: true
          cache: false
          path-type: minimal
          install: >-
            base-devel autotools cocom docbook-xsl gcc gettext-devel git
            libzstd-devel libiconv-devel mingw-w64-cross-crt mingw-w64-cross-gcc
            mingw-w64-cross-zlib perl xmlto zlib-devel zstd texinfo
      - name: Verify and preflight private GCC15 compiler (no system downgrade)
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          bash tools/probes/msys-runtime-experiment/toolchain.sh "$root/gcc15" 2>&1 | tee "$root/evidence/gcc15-preflight.log"
      - name: Build control from official source and all packaging patches
        id: control
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/build-trace.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/control-build" control 2>&1 | tee "$root/evidence/control-build.log"
      - name: Build observation-only instrumented runtime with identical toolchain
        id: instrumented
        if: always() && steps.control.outcome == 'success'
        timeout-minutes: 40
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root=$(cygpath -u "$EXPERIMENT_ROOT")
          export EXPERIMENT_TOOLCHAIN="$root/gcc15"
          bash tools/probes/msys-runtime-experiment/build-trace.sh "$root/msys2-runtime-3.6.11-4.src.tar.zst" "$root/instrumented-build" instrumented 2>&1 | tee "$root/evidence/instrumented-build.log"
          cmp "$root/control-build/provenance/pacman-before.txt" "$root/instrumented-build/provenance/pacman-before.txt"
      - name: Stage experimental copies without touching active runtime
        id: staging
        if: always() && steps.instrumented.outcome == 'success'
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/stage-trace.py "$env:EXPERIMENT_ROOT/original" "$env:EXPERIMENT_ROOT/control-build" "$env:EXPERIMENT_ROOT/control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/msys-runtime-experiment/stage-trace.py "$env:EXPERIMENT_ROOT/original" "$env:EXPERIMENT_ROOT/instrumented-build" "$env:EXPERIMENT_ROOT/instrumented"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One-shot resize after initial ZLE readiness (assertions stay strict)
        id: idle
        if: always() && steps.staging.outcome == 'success'
        timeout-minutes: 22
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/compare-trace.py --probe build-msys-trace/bundled_shell_probe.exe --fixture tools/probes/bundled_shell_fixture.zsh --original "$env:EXPERIMENT_ROOT/original" --control "$env:EXPERIMENT_ROOT/control" --instrumented "$env:EXPERIMENT_ROOT/instrumented" --provider "$env:EXPERIMENT_ROOT/conpty" --output "$env:EXPERIMENT_ROOT/evidence/idle" --workload idle --rounds 1
          exit $LASTEXITCODE
      - name: Separate assertion failures from invalid trace/infrastructure evidence
        id: idle_evidence
        if: always() && steps.staging.outcome == 'success'
        shell: python
        run: |
          import json, os, pathlib
          path = pathlib.Path(os.environ['EXPERIMENT_ROOT'])/'evidence/idle/results.json'
          valid = False
          try:
              rows = json.loads(path.read_text(encoding='utf-8'))
              expected = {(v,p) for v in ('original','control','instrumented') for p in ('inbox','packaged')}
              valid = (len(rows) == 6 and {(r['variant'],r['provider']) for r in rows} == expected
                       and all(r['workload'] == 'idle' and r['exit_code'] in (0,1)
                               and not r['trace_error'] and r['input_evidence_available']
                               and r['reaped'] and not r['timed_out'] and not r['cleanup_error'] for r in rows))
          except (OSError, ValueError, KeyError, TypeError) as error:
              print('Trace/infrastructure evidence unavailable:', error)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('valid=' + str(valid).lower() + '\n')
          if not valid:
              raise SystemExit('Repeated workload withheld: invalid/incomplete idle trace or infrastructure evidence')
          print('Idle assertion failures remain failures; independent repeated workload is permitted')
      - name: Separate fifty-phase workload (never retries the idle assertion)
        if: always() && steps.idle_evidence.outputs.valid == 'true'
        timeout-minutes: 22
        shell: pwsh
        run: |
          python tools/probes/msys-runtime-experiment/compare-trace.py --probe build-msys-trace/bundled_shell_probe.exe --fixture tools/probes/bundled_shell_fixture.zsh --original "$env:EXPERIMENT_ROOT/original" --control "$env:EXPERIMENT_ROOT/control" --instrumented "$env:EXPERIMENT_ROOT/instrumented" --provider "$env:EXPERIMENT_ROOT/conpty" --output "$env:EXPERIMENT_ROOT/evidence/repeated" --workload repeated --rounds 1
          exit $LASTEXITCODE
      - name: Upload source provenance and pre-diagnostic numeric traces only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msys-resize-trace-evidence-${{ github.sha }}
          if-no-files-found: warn
          # No candidate DLLs/packages, scratch HOME, ZLE journal, harness input
          # logs, or live/post-teardown runtime trace directories are uploaded.
          path: |
            ${{ env.EXPERIMENT_ROOT }}/gcc15/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/evidence/*.txt
            ${{ env.EXPERIMENT_ROOT }}/evidence/*.md
            ${{ env.EXPERIMENT_ROOT }}/evidence/idle/results.json
            ${{ env.EXPERIMENT_ROOT }}/evidence/idle/*/resize-trace-phase-*/*.log
            ${{ env.EXPERIMENT_ROOT }}/evidence/repeated/results.json
            ${{ env.EXPERIMENT_ROOT }}/evidence/repeated/*/resize-trace-phase-*/*.log
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/*.patch
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/*.cc
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/*.before
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/*.after
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/makepkg.conf
            ${{ env.EXPERIMENT_ROOT }}/control-build/provenance/PKGBUILD
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/*.txt
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/*.patch
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/*.cc
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/*.before
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/*.after
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/makepkg.conf
            ${{ env.EXPERIMENT_ROOT }}/instrumented-build/provenance/PKGBUILD
