name: Native craft review
on:
  push:
    branches: [feature/native-craft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-craft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-ui:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize native MSVC toolchain
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore pinned terminal engine
        id: engine_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Bootstrap pinned terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Cache successfully built terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - name: Configure isolated native UI build
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DSTORMTTY_TEST_INK=OFF
      - name: Build native app and layout/renderer checks
        run: cmake --build build-ui --parallel 2 --target stormtty window_geometry_tests core_commands_tests renderer_smoke
      - name: Exercise native keyboard flow and capture craft states
        id: capture
        shell: python
        run: |
          import importlib.util,json,pathlib,sys,os
          spec=importlib.util.spec_from_file_location('owned_runner',pathlib.Path('tools/run-owned-process.py'))
          runner=importlib.util.module_from_spec(spec);sys.modules[spec.name]=runner;spec.loader.exec_module(runner)
          artifacts=pathlib.Path('build-ui/artifacts').resolve();artifacts.mkdir(parents=True,exist_ok=True)
          failures=[]
          for mode in ['projects','settings']:
              result=runner.run_owned([str(pathlib.Path('build-ui/stormtty.exe').resolve()),'--smoke-'+mode,'--capture',str(artifacts/('craft-'+mode+'.png'))],timeout=90,output_dir=artifacts)
              log=result.output_tail.decode('utf-8',errors='replace')
              (artifacts/('craft-'+mode+'.log')).write_text(json.dumps(result.metadata(),sort_keys=True)+'\n'+log,encoding='utf-8')
              print(log,flush=True)
              if result.exit_code or not result.reaped or result.cleanup_error or result.timed_out: failures.append(mode)
          expected=['commands','end','narrow','fuzzy','no-results','background']
          missing=[name for name in expected if not (artifacts/('craft-projects-palette-'+name+'.png')).is_file()]
          expected_startup=['craft-projects-startup-prepared.png','craft-projects-startup-exposed.png','craft-settings-startup-prepared.png','craft-settings-startup-exposed.png','craft-projects-workspace-focus-000ms.png']
          missing.extend(name for name in expected_startup if not (artifacts/name).is_file())
          (artifacts/'manifest.json').write_text(json.dumps({'source_sha':os.environ['GITHUB_SHA'],'ai_enabled':False,'required_palette_captures':expected,'missing':missing,'failed_modes':failures},indent=2),encoding='utf-8')
          if failures or missing: raise SystemExit(1)
      - name: Publish native screenshots immediately
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-craft-${{ github.sha }}
          path: build-ui/artifacts/
          if-no-files-found: error
      - name: Run layout and renderer checks
        if: always() && steps.capture.outcome != 'skipped'
        run: ctest --test-dir build-ui -R "^(window_geometry_tests|core_commands_tests|renderer_smoke)$" --no-tests=error --output-on-failure --output-junit focused-tests.xml
      - name: Preserve focused test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-craft-tests-${{ github.sha }}
          path: |
            build-ui/focused-tests.xml
            build-ui/Testing/Temporary/LastTest.log
            build-ui/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
