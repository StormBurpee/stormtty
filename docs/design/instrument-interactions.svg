<rect x="0" y="0" width="1600" height="1100" rx="0" fill="#E7EBEF" />
<text x="48" y="61" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="28" font-weight="600" >Native at the edges</text>
<text x="48" y="91" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="400" >Keyboard commands, precise pane movement, and a titlebar that behaves like Windows.</text>
<text x="1552" y="59" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="14" font-weight="600" text-anchor="end">StormTTY</text>
<text x="1552" y="83" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="12" font-weight="400" text-anchor="end">Design council / 28 October 2026</text>
<text x="48" y="146" fill="#26313C" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="18" font-weight="600" >Commands</text>
<text x="48" y="171" fill="#5F6D7B" font-family="Segoe UI Variable Text,DejaVu Sans,sans-serif" font-size="13" font-weight="400" >Fast actions; no assistant layer over the shell.</text>
