# Root-owned exact-branch push only; no dispatch or automatic retries.
name: Native managed npm completion qualification
on:
  push:
    branches: [diagnostic/npm-completion]
permissions:
  contents: read
concurrency:
  group: npm-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/npm-completion'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Record exact source and preinstalled native tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence-npm | Out-Null
          git rev-parse HEAD | Set-Content evidence-npm/commit.txt
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $directory = Split-Path $node
          if (!(Test-Path "$directory/npm") -or !(Test-Path "$directory/npm.cmd")) { throw 'Native npm shim missing beside node.exe' }
          "NPM_NODE_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $node --version | Set-Content evidence-npm/node-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$directory/npm.cmd" --version | Set-Content evidence-npm/npm-version.txt
          exit $LASTEXITCODE
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore exact pinned terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing engine once
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Build existing native shell probe
        timeout-minutes: 12
        shell: pwsh
        run: |
          cmake -S . -B build-npm -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_BUNDLE_ZSH=OFF -DSTORMTTY_BUNDLE_CONPTY=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-npm --target shell_navigation_probe --parallel 2
          exit $LASTEXITCODE
      - name: Stage exact pinned managed shell with current preset
        timeout-minutes: 12
        run: python tools/shell-bootstrap.py --destination .deps/npm-shell --cache .cache/shell-bootstrap
      - name: Qualify real native npm and ConPTY ZLE once
        timeout-minutes: 4
        shell: python
        run: |
          import importlib.util, json, os, pathlib, sys
          spec = importlib.util.spec_from_file_location('owned_runner', pathlib.Path('tools/run-owned-process.py'))
          runner = importlib.util.module_from_spec(spec); sys.modules[spec.name] = runner; spec.loader.exec_module(runner)
          evidence = pathlib.Path('evidence-npm')
          result = runner.run_owned([str(pathlib.Path('build-npm/shell_navigation_probe.exe').resolve()),
              '--npm', str(pathlib.Path('.deps/npm-shell').resolve()), os.environ['NPM_NODE_DIRECTORY']],
              timeout=180, output_dir=evidence)
          text = result.output_tail.decode('utf-8', errors='replace')
          # Probe emits only fixed numeric results, never terminal frames or npm logs.
          (evidence/'result.log').write_text(text, encoding='utf-8')
          (evidence/'process.json').write_text(json.dumps(result.metadata(), indent=2), encoding='utf-8')
          print(text, flush=True)
          passed = 'NPM_COMPLETION_RESULT code=0 phase=204 ' in text
          raise SystemExit(int(not passed or result.exit_code != 0 or result.timed_out or
              result.output_truncated or not result.reaped or bool(result.cleanup_error)))
      - name: Preserve bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-completion-native-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: evidence-npm/*
