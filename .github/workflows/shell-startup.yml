# Root-owned intentional source pushes on this diagnostic branch qualify.
# Never push unchanged retries until green; no main/PR/dispatch trigger.
name: Opt-in managed shell startup diagnostics
on:
  push:
    branches: [diagnostic/shell-startup]
permissions:
  contents: read
concurrency:
  group: shell-startup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/shell-startup'
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare owned evidence directory
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA ("StormTTY shell startup " + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path "$root/evidence" | Out-Null
          "STARTUP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git rev-parse HEAD | Set-Content "$root/evidence/commit.txt"
      - name: Check fixed diagnostic evidence parser
        timeout-minutes: 3
        shell: pwsh
        run: |
          python tools/run-owned-process-tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probes/shell-startup-app-tests.py
          exit $LASTEXITCODE
      - name: Initialize native compiler
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Restore exact terminal engine
        id: engine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Build missing pinned engine once
        if: steps.engine.outputs.cache-hit != 'true'
        timeout-minutes: 25
        shell: pwsh
        run: |
          python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2 2>&1 | Tee-Object "$env:STARTUP_ROOT/evidence/engine.log"
          exit $LASTEXITCODE
      - name: Stage exact current managed runtime
        timeout-minutes: 12
        shell: pwsh
        run: |
          python tools/shell-bootstrap.py --destination "$env:STARTUP_ROOT/source-runtime" --cache .cache/shell-bootstrap 2>&1 | Tee-Object "$env:STARTUP_ROOT/evidence/staging.log"
          exit $LASTEXITCODE
      - name: Build current application with unchanged default OFF
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Deliberately omit the seed option: verify the real default, not an override.
          cmake -S . -B "$env:STARTUP_ROOT/build-default-off" -G Ninja -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_SHELL_PROBE=ON -DSTORMTTY_BUNDLE_CONPTY=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DSTORMTTY_GHOSTTY_ROOT=$env:GITHUB_WORKSPACE/.deps/ghostty-native" "-DSTORMTTY_DEVELOPER_SHELL_RUNTIME=$env:STARTUP_ROOT/source-runtime"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:STARTUP_ROOT/build-default-off" --target stormtty startup_diagnostic_observation_tests --parallel 2 2>&1 | Tee-Object "$env:STARTUP_ROOT/evidence/default-off-build.log"
          exit $LASTEXITCODE
      - name: Qualify isolated actual-app startup diagnostics
        timeout-minutes: 11
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['STARTUP_ROOT'])
          result=subprocess.run([sys.executable,'tools/probes/run-shell-startup-app.py',
              '--build',str(root/'build-default-off'),'--output',str(root/'evidence')],timeout=600)
          raise SystemExit(result.returncode)
      - name: Always retain only fixed numeric diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-startup-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.STARTUP_ROOT }}/evidence/startup-app-*.log
