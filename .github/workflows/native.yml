name: Native build and runtime evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Ink fixture dependencies
        run: npm ci --prefix tests/ink --ignore-scripts --no-audit --no-fund
      - name: Reject noninteractive Ink false positives
        run: npm test --prefix tests/ink
      - name: Initialize Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Install macOS C++20 toolchain
        if: runner.os == 'macOS'
        run: brew install llvm@20
      - name: Restore pinned terminal engine
        id: engine_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap.lock.json', 'tools/bootstrap.py') }}
      - name: Bootstrap pinned terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: python tools/bootstrap.py --install-zig --prefix .deps/ghostty-native --jobs 2
      - name: Cache successfully built terminal engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .deps/ghostty-native
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - name: Check bootstrap boundary tests
        run: |
          python -m unittest discover -s tools -p 'bootstrap_test*.py' -v
          python tools/shell-notices-tests.py
          python tools/stage-developer-shell-tests.py
          python tools/shell-zstd-bootstrap-tests.py
          python tools/run-owned-process-tests.py
      - name: Configure native Windows application
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja "-DPython3_EXECUTABLE=${{ env.pythonLocation }}/python.exe" -DCMAKE_CXX_COMPILER=cl -DSTORMTTY_TEST_SHELL_PROBE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_INK=ON
      - name: Configure portable core and native POSIX transport
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=OFF -DSTORMTTY_TEST_INK=ON
      - name: Configure native macOS application
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/MacOSLLVM.cmake -DSTORMTTY_LLVM_ROOT="$(brew --prefix llvm@20)" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTORMTTY_GHOSTTY_ROOT=${{ github.workspace }}/.deps/ghostty-native -DSTORMTTY_BUILD_APP=ON -DSTORMTTY_TEST_INK=ON
      - name: Build
        id: build
        run: cmake --build build --parallel 2
      - name: Run blocking native baseline tests
        id: native_tests
        run: ctest --test-dir build -LE qualification --no-tests=error --output-on-failure --output-junit test-results.xml --parallel 1
      - name: Preserve baseline evidence immediately
        if: always() && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/pane-context-light.png
            build/pane-context-dark.png
            build/artifacts/workspace-*.png
            build/artifacts/native-agent*.png
            build/artifacts/native-settings*appearance*.png
            build/artifacts/native-settings*ribbon*.png
      - name: Verify bundled console cached repair and portable install
        if: always() && runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: python
        run: |
          import pathlib,subprocess,sys,importlib.util,json
          subprocess.run(['cmake','-S','.','-B','build','-DSTORMTTY_CONPTY_OFFLINE=ON'],check=True,timeout=120)
          subprocess.run(['cmake','--build','build','--target','stormtty','--parallel','2'],check=True,timeout=180)
          runtime=pathlib.Path('build/runtimes/conpty/1.25.260930003/x64').resolve()
          # Delete only a generated private payload; the owned receipt enables cached repair.
          (runtime/'OpenConsole.exe').unlink()
          subprocess.run(['cmake','--build','build','--target','stormtty','--parallel','2'],check=True,timeout=180)
          subprocess.run([sys.executable,'tools/prepare-bundled-conpty.py','--destination',str(runtime),'--cache',str(pathlib.Path('.cache/conpty').resolve()),'--verify-only'],check=True,timeout=90)
          install=pathlib.Path('build/portable console é').resolve()
          subprocess.run(['cmake','--install','build','--prefix',str(install)],check=True,timeout=240)
          spec=importlib.util.spec_from_file_location('owned_runner',pathlib.Path('tools/run-owned-process.py'))
          runner=importlib.util.module_from_spec(spec);sys.modules[spec.name]=runner;spec.loader.exec_module(runner)
          capture=pathlib.Path('build/artifacts/native-console-installed-settings.png').resolve()
          result=runner.run_owned([str(install/'stormtty.exe'),'--smoke-settings','--capture',str(capture)],timeout=90,output_dir=capture.parent)
          print('INSTALLED_CONSOLE_PROCESS_RESULT='+json.dumps(result.metadata(),sort_keys=True),flush=True)
          print(result.output_tail.decode('utf-8',errors='replace'),flush=True)
          raise SystemExit(result.exit_code)
      - name: Verify explicit packaged console dependency
        id: packaged_console
        if: always() && runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: pwsh
        run: ./tools/prepare-conpty-probe.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'stormtty-conpty-qualified')
      - name: Verify application with explicit packaged console
        if: always() && runner.os == 'Windows' && steps.packaged_console.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess,importlib.util,sys,json
          spec=importlib.util.spec_from_file_location("owned_runner",pathlib.Path("tools/run-owned-process.py"))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          failures=[]
          for mode in ['smoke','smoke-layout','smoke-modal','smoke-projects','smoke-settings']:
            capture=pathlib.Path('build/artifacts')/('native-packaged-'+mode+'.png')
            args=[str(pathlib.Path('build/stormtty.exe').resolve()),'--'+mode,'--console-runtime',str(provider),'--capture',str(capture.resolve())]
            print('PACKAGED_APPLICATION_CASE='+mode,flush=True)
            result=runner.run_owned(args,timeout=60,output_dir=pathlib.Path("build/artifacts"))
            print("OWNED_PROCESS_RESULT="+json.dumps(result.metadata(),sort_keys=True),flush=True)
            print(result.output_tail.decode("utf-8",errors="replace"),flush=True)
            code=result.exit_code
            print('PACKAGED_APPLICATION_RESULT='+mode+':'+str(code),flush=True)
            if code: failures.append(mode)
          raise SystemExit(1 if failures else 0)
      - name: Set up bundled shell staging Python
        if: always() && runner.os == 'Windows' && steps.packaged_console.outcome == 'success'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Verify bundled shell staging safety
        id: shell_safety
        if: always() && runner.os == 'Windows' && steps.packaged_console.outcome == 'success'
        run: python tools/shell-bootstrap-tests.py
      - name: Stage pinned private Zsh candidate
        id: staged_shell
        if: always() && runner.os == 'Windows' && steps.shell_safety.outcome == 'success'
        run: python tools/shell-bootstrap.py --destination .deps/stormtty-shell --cache .cache/shell-bootstrap
      - name: Build optional managed shell startup measurement
        id: startup_probe_build
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        timeout-minutes: 4
        shell: python
        run: |
          import subprocess
          # EXCLUDE_FROM_ALL target includes its app-owned console sidecar.
          subprocess.run(['cmake','--build','build','--target','managed_shell_startup_probe','--parallel','2'],check=True,timeout=180)
      - name: Measure managed shell startup on both console providers
        id: startup_measurement
        if: always() && runner.os == 'Windows' && steps.startup_probe_build.outcome == 'success'
        timeout-minutes: 10
        shell: python
        run: |
          import os,pathlib,importlib.util,sys,re
          spec=importlib.util.spec_from_file_location('owned_runner',pathlib.Path('tools/run-owned-process.py'))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          probe=pathlib.Path('build/managed_shell_startup_probe.exe').resolve()
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          artifacts=pathlib.Path('build/artifacts'); artifacts.mkdir(parents=True,exist_ok=True)
          number=r'[0-9]+(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?'
          sample=re.compile(r'STARTUP_SAMPLE sample=([0-9]+) fresh_state=([01]) state_prepare_ms='+number+r' launch_to_zle_ms='+number)
          terminal=re.compile(r'STARTUP_RESULT code=(?:0 fresh_samples=3 warm_samples=7|1 sample=[0-9]+ stage=[0-9]+)')
          failures=[]
          for name,extra in [('inbox',[]),('packaged',[str(provider)])]:
            # Each invocation creates three new private states, then reuses the
            # third for seven warm launches. No user state or transcript artifact.
            lines=[]; passed=False
            try:
              result=runner.run_owned([str(probe),str(runtime),*extra],timeout=240,reap_timeout=10,tail_bytes=16384,output_dir=artifacts)
              samples=[]
              for line in result.output_tail.decode('utf-8',errors='replace').splitlines():
                match=sample.fullmatch(line)
                if match:
                  samples.append((int(match[1]),int(match[2]))); lines.append(line)
                elif terminal.fullmatch(line): lines.append(line)
              expected=[(i,int(i<=3)) for i in range(1,11)]
              passed=(result.exit_code==0 and result.reaped and not result.output_truncated and not result.cleanup_error and samples==expected and 'STARTUP_RESULT code=0 fresh_samples=3 warm_samples=7' in lines)
              # Do not publish arbitrary stderr, paths, environment, or exception
              # strings. Only allowlisted probe records and numeric runner facts.
              lines.append('STARTUP_RUNNER exit_code=%d timed_out=%d reaped=%d truncated=%d cleanup_error=%d elapsed_seconds=%.3f' % (result.exit_code,result.timed_out,result.reaped,result.output_truncated,bool(result.cleanup_error),result.elapsed_seconds))
            except OSError:
              lines.append('STARTUP_LAUNCH_ERROR code=1')
            lines.append('STARTUP_EVIDENCE_VALID code='+str(0 if passed else 1))
            (artifacts/('shell-startup-'+name+'.log')).write_text('\n'.join(lines)+'\n',encoding='utf-8')
            print('STARTUP_PROVIDER='+name,flush=True)
            print('\n'.join(lines),flush=True)
            if not passed: failures.append(name)
          # Evidence integrity/liveness only: no latency threshold or speed claim.
          if failures: raise SystemExit(1)
      - name: Preserve sanitized shell startup measurements immediately
        if: always() && runner.os == 'Windows' && steps.startup_measurement.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-startup-${{ runner.os }}
          path: build/artifacts/shell-startup-*.log
          if-no-files-found: warn
      - name: Qualify real managed OMZ state and interactive editing
        id: managed_omz
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          probe=pathlib.Path('build/managed_shell_state_probe.exe').resolve()
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          # The native harness itself creates an isolated Unicode known-folder
          # root and calls the actual owner/DACL validator before EVERY launch.
          # It fails (never skips) absent persistence/modules/editing evidence.
          # Only fixed result codes and numeric timings are emitted; no private
          # config/history/state tree or terminal transcript becomes an artifact.
          failures=[]
          for name,extra in [('inbox',[]),('packaged',[str(provider)])]:
            print('MANAGED_OMZ_PROVIDER='+name,flush=True)
            result=subprocess.run([str(probe),str(runtime),*extra],timeout=180)
            print('MANAGED_OMZ_RESULT='+name+':'+str(result.returncode),flush=True)
            if result.returncode: failures.append(name)
          if failures: raise SystemExit(1)
      - name: Qualify bundled fzf and zoxide navigation
        id: shell_navigation
        if: always() && runner.os == 'Windows' && steps.managed_omz.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,importlib.util,sys,json
          spec=importlib.util.spec_from_file_location("owned_runner",pathlib.Path("tools/run-owned-process.py"))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          probe=pathlib.Path('build/shell_navigation_probe.exe').resolve()
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          failures=[]
          for name,extra in [('inbox',[]),('packaged',[str(provider)])]:
            print('SHELL_NAVIGATION_PROVIDER='+name,flush=True)
            result=runner.run_owned([str(probe),str(runtime),*extra],timeout=240,output_dir=pathlib.Path('build/artifacts'))
            metadata=json.dumps(result.metadata(),sort_keys=True)
            output=result.output_tail.decode('utf-8',errors='replace')
            pathlib.Path('build/artifacts/shell-navigation-'+name+'.log').write_text(metadata+'\n'+output,encoding='utf-8')
            print(metadata,flush=True)
            print(output,flush=True)
            print('SHELL_NAVIGATION_RESULT='+name+':'+str(result.exit_code),flush=True)
            if result.exit_code: failures.append(name)
          if failures: raise SystemExit(1)
      - name: Preserve navigation evidence immediately
        if: always() && runner.os == 'Windows' && steps.shell_navigation.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shell-navigation-${{ runner.os }}
          path: |
            build/artifacts/shell-navigation-*.log
            build/artifacts/shell-tools-zoxide-init.zsh
      - name: Qualify live shell directory and Git context
        id: managed_context
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          probe=pathlib.Path('build/managed_shell_context_probe.exe').resolve()
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          # The native harness itself creates an isolated Unicode known-folder
          # root and calls the actual owner/DACL validator before EVERY launch.
          # It fails (never skips) absent persistence/modules/editing evidence.
          # Only fixed result codes and numeric timings are emitted; no private
          # config/history/state tree or terminal transcript becomes an artifact.
          failures=[]
          for name,extra in [('inbox',[]),('packaged',[str(provider)])]:
            print('MANAGED_CONTEXT_PROVIDER='+name,flush=True)
            result=subprocess.run([str(probe),str(runtime),*extra],timeout=180)
            print('MANAGED_CONTEXT_RESULT='+name+':'+str(result.returncode),flush=True)
            if result.returncode: failures.append(name)
          if failures: raise SystemExit(1)
      - name: Qualify bundled nano edit save and exit
        id: managed_nano
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess,sys
          subprocess.run([sys.executable,'tools/run-nano-probe-tests.py'],check=True)
          subprocess.run([sys.executable,'tools/run-nano-probe.py',
            '--runtime','.deps/stormtty-shell','--probe','build/managed_nano_probe.exe',
            '--provider',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'),
            '--output','build/artifacts/nano'],check=True)
      - name: Preserve nano qualification evidence immediately
        if: always() && runner.os == 'Windows' && steps.managed_nano.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nano-qualification-windows
          path: build/artifacts/nano/nano-*.log
      - name: Verify managed shell HOME and drive paths
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'tools/shell-path-protocol-tests.py'],check=True)
          subprocess.run([sys.executable,'tools/shell-path-tests.py','--runtime','.deps/stormtty-shell',
                          '--resolver-probe','build/bundled_shell_probe.exe'],check=True)
      - name: Verify application with bundled Zsh
        id: bundled_application
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess,importlib.util,sys,json
          spec=importlib.util.spec_from_file_location("owned_runner",pathlib.Path("tools/run-owned-process.py"))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          failures=[]
          for mode in ['smoke','smoke-layout','smoke-modal','smoke-projects','smoke-settings']:
            capture=pathlib.Path('build/artifacts')/('native-zsh-'+mode+'.png')
            args=[str(pathlib.Path('build/stormtty.exe').resolve()),'--'+mode,'--console-runtime',str(provider),'--shell-runtime',str(runtime),'--capture',str(capture.resolve())]
            print('BUNDLED_ZSH_APPLICATION_CASE='+mode,flush=True)
            result=runner.run_owned(args,timeout=60,output_dir=pathlib.Path("build/artifacts"))
            print("OWNED_PROCESS_RESULT="+json.dumps(result.metadata(),sort_keys=True),flush=True)
            print(result.output_tail.decode("utf-8",errors="replace"),flush=True)
            code=result.exit_code
            (pathlib.Path('build/artifacts')/('bundled-'+mode+'.log')).write_bytes(result.output_tail)
            print('BUNDLED_ZSH_APPLICATION_RESULT='+mode+':'+str(code),flush=True)
            if code: failures.append(mode)
          raise SystemExit(1 if failures else 0)
      - name: Preserve bundled app evidence immediately
        if: always() && runner.os == 'Windows' && steps.bundled_application.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundled-app-windows
          path: |
            build/artifacts/bundled-*.log
            build/artifacts/native-zsh-*.png
      - name: Build with app-owned developer Zsh runtime
        id: developer_shell_build
        if: always() && runner.os == 'Windows' && steps.staged_shell.outcome == 'success'
        shell: python
        run: |
          import pathlib,subprocess
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          subprocess.run(['cmake','-S','.','-B','build','-DSTORMTTY_DEVELOPER_SHELL_RUNTIME='+str(runtime)],check=True,timeout=240)
          subprocess.run(['cmake','--build','build','--target','stormtty','--parallel','2'],check=True,timeout=360)
      - name: Verify app-owned Zsh without shell launch flag
        if: always() && runner.os == 'Windows' && steps.developer_shell_build.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,subprocess,importlib.util,sys,json
          spec=importlib.util.spec_from_file_location("owned_runner",pathlib.Path("tools/run-owned-process.py"))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          failures=[]
          for mode in ['smoke','smoke-layout','smoke-modal','smoke-projects','smoke-settings']:
            capture=pathlib.Path('build/artifacts')/('native-developer-zsh-'+mode+'.png')
            args=[str(pathlib.Path('build/stormtty.exe').resolve()),'--'+mode,'--console-runtime',str(provider),'--capture',str(capture.resolve())]
            print('DEVELOPER_ZSH_APPLICATION_CASE='+mode,flush=True)
            result=runner.run_owned(args,timeout=90,output_dir=pathlib.Path("build/artifacts"))
            print("OWNED_PROCESS_RESULT="+json.dumps(result.metadata(),sort_keys=True),flush=True)
            print(result.output_tail.decode("utf-8",errors="replace"),flush=True)
            code=result.exit_code
            print('DEVELOPER_ZSH_APPLICATION_RESULT='+mode+':'+str(code),flush=True)
            if code: failures.append(mode)
          raise SystemExit(1 if failures else 0)
      - name: Repeat owned Windows settings teardown
        if: always() && runner.os == 'Windows' && steps.developer_shell_build.outcome == 'success'
        shell: python
        run: |
          import os,pathlib,importlib.util,sys,json
          spec=importlib.util.spec_from_file_location("owned_runner",pathlib.Path("tools/run-owned-process.py"))
          runner=importlib.util.module_from_spec(spec); sys.modules[spec.name]=runner; spec.loader.exec_module(runner)
          provider=pathlib.Path(os.environ['RUNNER_TEMP'])/'stormtty-conpty-qualified'
          runtime=pathlib.Path('.deps/stormtty-shell').resolve()
          failures=[]
          for mode,count in [('explicit',10),('default',3)]:
            for index in range(count):
              name='teardown-'+mode+'-'+str(index+1)
              capture=pathlib.Path('build/artifacts')/(name+'.png')
              args=[str(pathlib.Path('build/stormtty.exe').resolve()),'--smoke-settings','--console-runtime',str(provider),'--capture',str(capture.resolve())]
              if mode=='explicit': args+=['--shell-runtime',str(runtime)]
              print('TEARDOWN_CASE='+name,flush=True)
              result=runner.run_owned(args,timeout=30,output_dir=pathlib.Path('build/artifacts'))
              print(result.output_tail.decode('utf-8',errors='replace'),flush=True)
              print('TEARDOWN_RESULT='+json.dumps({'case':name,**result.metadata()},sort_keys=True),flush=True)
              if result.exit_code: failures.append(name)
          print('TEARDOWN_FAILURES='+json.dumps(failures),flush=True)
          raise SystemExit(1 if failures else 0)
      - name: Collect targeted macOS GUI failure evidence
        if: always() && runner.os == 'macOS' && steps.build.outcome == 'success' && steps.native_tests.outcome == 'failure'
        run: python tools/macos-crash-evidence.py
      - name: Record native frame for review
        if: always() && runner.os == 'Windows'
        shell: python
        run: |
          import pathlib,base64,hashlib
          for name in ('native-window.png', 'native-layout.png', 'native-modal.png', 'native-projects.png', 'native-settings.png', 'native-settings-console.png', 'native-console-installed-settings-console.png'):
            p=pathlib.Path('build/artifacts')/name
            print('STORMTTY_NATIVE_FRAME_NAME='+name)
            if p.exists():
              b=p.read_bytes()
              print('STORMTTY_NATIVE_FRAME_SHA256='+hashlib.sha256(b).hexdigest())
              print('STORMTTY_NATIVE_FRAME_BASE64_BEGIN')
              s=base64.b64encode(b).decode()
              for i in range(0,len(s),4096): print(s[i:i+4096])
              print('STORMTTY_NATIVE_FRAME_BASE64_END')
            else: print('Native frame unavailable; do not claim visual verification.')
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build/pane-context-light.png
            build/pane-context-dark.png
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/artifacts/*.png
            build/artifacts/shell-tools-zoxide-init.zsh
            build/artifacts/bundled-*.log
            build/artifacts/macos-debugger.log
            build/artifacts/stormtty-crash.*
            build/artifacts/ink-transport/*.bin
            build/artifacts/ink-packaged-transport/*.bin
            .deps/ghostty-native/stormtty-build.json
            .deps/ghostty-native/stormtty-bootstrap.lock.json
          if-no-files-found: warn
