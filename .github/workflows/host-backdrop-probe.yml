name: Isolated host-backdrop native compile and WARP graph
on:
  pull_request:
    paths:
      - '.github/workflows/host-backdrop-probe.yml'
      - 'tools/probes/host-backdrop*'
      - 'tools/probes/run-host-backdrop-blur.ps1'
      - 'tools/probes/CMakeLists.txt'
      - 'tools/run-owned-process.py'
      - 'tools/ci-msvc-env.ps1'
  push:
    branches: ['probe/host-backdrop-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-backdrop-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Native SDK compile + WARP ABI/lifecycle only
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize native MSVC and Windows SDK
        shell: pwsh
        run: ./tools/ci-msvc-env.ps1
      - name: Test evidence classification
        run: python tools/probes/host-backdrop-ci-tests.py
      - name: Configure isolated existing probe source (no app or engine)
        run: cmake -S tools/probes -B build/host-backdrop -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compile native host-backdrop executable
        id: compile
        run: cmake --build build/host-backdrop --target stormtty_host_backdrop_probe --parallel 2
      - name: Owned WARP graph diagnostic (not hardware or physical blur)
        if: steps.compile.outcome == 'success'
        timeout-minutes: 2
        run: python tools/probes/host-backdrop-ci.py --exe build/host-backdrop/stormtty_host_backdrop_probe.exe --output build/host-backdrop/evidence
      - name: Preserve native compile and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-backdrop-native-compile-warp-only
          path: |
            build/host-backdrop/CMakeFiles/CMakeConfigureLog.yaml
            build/host-backdrop/stormtty_host_backdrop_probe.exe
            build/host-backdrop/evidence/*.json
            build/host-backdrop/evidence/*.log
          if-no-files-found: warn
